<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Agenda de reservas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef2f2; --surface:#ffffff; --ink:#12232b; --muted:#5d727b; --line:#d6e0e2;
  --accent:#0a6a7d; --accent-ink:#ffffff; --accent-soft:#d9eef2;
  --warn:#9a6200; --warn-soft:#fbecc9; --bad:#b3261e; --head:#e3ebec;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b20; --surface:#17262d; --ink:#e6eff1; --muted:#93a9b1; --line:#2a3f48;
  --accent:#4fc0d4; --accent-ink:#06222a; --accent-soft:#17414b;
  --warn:#f0bf5a; --warn-soft:#46350f; --bad:#ff8a80; --head:#1d3039; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:0}
h2{font-family:var(--f-display);font-size:18px;margin:0}
.sub{color:var(--muted);margin-top:4px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 8px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:40px;min-width:0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.login{max-width:420px;margin:12px auto 0;width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:0}
.calhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.calhead h2{text-transform:capitalize}
.calnav{display:flex;gap:6px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{font-size:12px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.day{font:inherit;min-height:56px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day.out{visibility:hidden;pointer-events:none}
.day.past{opacity:.55}
.day.today{border-color:var(--warn);border-width:2px}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.day .n{font-family:var(--f-num);font-size:14px;font-weight:500}
.day .c{font-size:11px;font-family:var(--f-num);font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.day .p{font-size:10px;color:var(--muted);font-family:var(--f-num)}
.item{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-family:var(--f-num);font-weight:600;font-size:18px;min-width:56px;color:var(--accent)}
.item .i{flex:1 1 200px;min-width:0}
.item .i b{font-family:var(--f-display);font-size:16px}
.item .i span{color:var(--muted)}
.item .a{display:flex;gap:6px}
.item.editing{background:var(--accent-soft)}
.dayhead{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--head);border-radius:8px 8px 0 0}
.dayhead span{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:20;max-width:90vw}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.busy{opacity:.6;pointer-events:none}
@media (max-width:560px){h1{font-size:22px}.day{min-height:50px}}
</style></head><body>
<div class="wrap">
  <header>
    <div><h1>Agenda de reservas</h1><div class="sub" id="sub">Cargando…</div></div>
    <div class="row"><button class="btn small" id="btnOut" hidden>Salir</button></div>
  </header>
  <div id="banner"></div>
  <nav role="tablist" id="tabs" hidden>
    <button role="tab" data-tab="cal" aria-selected="true">Calendario</button>
    <button role="tab" data-tab="agenda" aria-selected="false">Próximas reservas</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=isoOf(new Date());
const parse=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const shiftMonth=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const fdate=iso=>{const d=parse(iso);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESL[d.getMonth()]};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const toMin=t=>{const p=String(t||'').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)};
const byHora=(a,b)=>toMin(a.hora)-toMin(b.hora)||String(a.nombre).localeCompare(String(b.nombre));
const plural=(n,s,p)=>n+' '+(n===1?s:p);
const llegTxt=r=>r.llegada?' · <b style="color:var(--ok)">✓ llegaron '+(Number(r.llegada.personas)||0)+(r.llegada.hora?' ('+esc(r.llegada.hora)+')':'')+'</b>':r.noLlego?' · <b style="color:var(--bad)">✗ no llegó</b>':'';
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}

const TK='agenda_tok',UK='agenda_user';
const S={acc:null,tok:'',user:'',reservas:[],fecha:todayISO,mes:todayISO.slice(0,7),edit:null,tab:'cal',confirm:null,busy:false,err:'Cargando…',loaded:false,last:0};

/* ---------- cifrado: el token de GitHub solo se abre con la contraseña ---------- */
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,acc){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(acc.salt),iterations:acc.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(acc.iv)},key,fromB64(acc.ct));
  return JSON.parse(new TextDecoder().decode(pt)).t;
}

/* ---------- GitHub ---------- */
const cfg=()=>({owner:S.acc.owner,repo:S.acc.repo,token:S.tok});
const ghUrl=(c,f)=>'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+(f||'data.json');
const ghH=c=>({'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));
function ghErr(r){const e=new Error(r.status===401?'El acceso venció. Entra de nuevo.':r.status===403?'No hay permiso para guardar. Avisa al administrador.':r.status===404?'No encuentro los datos. Avisa al administrador.':'GitHub respondió con error '+r.status+'.');e.status=r.status;return e}
async function ghRead(){
  const c=cfg(),r=await fetch(ghUrl(c),{headers:ghH(c),cache:'no-store'});if(!r.ok)throw ghErr(r);
  const o=await r.json();let d={};try{d=JSON.parse(b64d(o.content))}catch(e){}
  if(!Array.isArray(d.reservas))d.reservas=[];
  return{sha:o.sha,data:d};
}
/* Lee lo más reciente, aplica SOLO este cambio y guarda. Si alguien guardó al mismo tiempo, reintenta. */
async function ghUpdate(msg,fn){
  const c=cfg();
  for(let i=0;i<4;i++){
    const {sha,data}=await ghRead();
    const next=fn(data);
    next.reservas.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    next.cfg=Object.assign(next.cfg||{},{actualizado:todayISO});
    const p=await fetch(ghUrl(c),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH(c)),body:JSON.stringify({message:msg,content:b64e(JSON.stringify(next,null,1)),sha})});
    if(p.ok)return next;
    if(p.status!==409&&p.status!==422)throw ghErr(p);
  }
  throw new Error('Alguien más guardó al mismo tiempo. Intenta otra vez.');
}

/* ---------- vistas ---------- */
function formHtml(e){
  const [eh,em]=e?String(e.hora).split(':'):['',''];
  const mins=[];for(let i=0;i<60;i+=5)mins.push(pad(i));if(em&&!mins.includes(em))mins.push(em);mins.sort();
  const hopt='<option value="">--</option>'+Array.from({length:24},(_,i)=>`<option value="${pad(i)}"${pad(i)===eh?' selected':''}>${pad(i)}</option>`).join('');
  const mopt=mins.map(x=>`<option value="${x}"${x===(em||'00')?' selected':''}>${x}</option>`).join('');
  return `<div class="card panel" id="formcard"><h2>${e?'Editar reserva':'Agregar reserva'}</h2>
    <div class="row">
      <div class="fld"><label for="rf">Fecha</label><input id="rf" type="date" value="${esc(e?e.fecha:S.fecha)}" style="font-family:var(--f-num)"></div>
      <div class="fld"><label for="rhh">Hora (24 h)</label><div style="display:flex;gap:4px;align-items:center"><select id="rhh" style="font-family:var(--f-num)">${hopt}</select><b>:</b><select id="rhm" style="font-family:var(--f-num)">${mopt}</select></div></div>
      <div class="fld"><label for="rp">Personas</label><input id="rp" type="number" min="1" inputmode="numeric" value="${esc(e?e.personas:'')}" style="width:90px;font-family:var(--f-num)"></div>
    </div>
    <div class="row">
      <div class="fld" style="flex:1 1 180px"><label for="rn">Nombre</label><input id="rn" type="text" value="${esc(e?e.nombre:'')}" autocomplete="off" placeholder="Solo nombre"></div>
      <div class="fld" style="flex:1 1 200px"><label for="rt">Nota (opcional)</label><input id="rt" type="text" value="${esc(e?e.nota:'')}" autocomplete="off" placeholder="Ej. cumpleaños, alergia, mesa 3"></div>
    </div>
    <div class="row"><button class="btn primary" data-act="save">${e?'Guardar cambios':'Agregar reserva'}</button>${e?'<button class="btn" data-act="cancel">Cancelar</button>':''}</div>
    <p class="note">Se guarda al momento y mesa y recepción lo ven en 1 o 2 minutos.</p></div>`;
}
const itemHtml=(r,editAct)=>`<div class="item${S.edit===r.id?' editing':''}"><span class="t">${esc(r.hora)}</span><div class="i"><b>${esc(r.nombre)}</b> <span>· ${Number(r.personas)||'?'} pers.${r.nota?' · '+esc(r.nota):''}${r.por?' · por '+esc(r.por):''}${llegTxt(r)}</span></div><div class="a"><button class="btn small" data-act="${editAct}" data-id="${esc(r.id)}">Editar</button><button class="btn small danger" data-act="del" data-id="${esc(r.id)}">${S.confirm==='r:'+r.id?'¿Borrar?':'Borrar'}</button></div></div>`;

function viewCal(){
  const [y,m]=S.mes.split('-').map(Number);
  const lead=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
  const agg={};let totC=0;
  S.reservas.forEach(r=>{const a=agg[r.fecha]||(agg[r.fecha]={c:0,p:0});a.c++;a.p+=Number(r.personas)||0;if(String(r.fecha).startsWith(S.mes))totC++});
  let cells='';for(let i=0;i<lead;i++)cells+='<span class="day out"></span>';
  for(let d=1;d<=dim;d++){const iso=y+'-'+pad(m)+'-'+pad(d),a=agg[iso];
    cells+=`<button class="day${iso<todayISO?' past':''}${iso===todayISO?' today':''}${iso===S.fecha?' sel':''}" data-act="goto" data-d="${iso}" aria-label="${esc(fdate(iso))}${a?', '+plural(a.c,'reserva','reservas'):''}"><span class="n">${d}</span>${a?`<span class="c">${a.c}</span><span class="p">${a.p}p</span>`:''}</button>`}
  let h=`<div class="card panel"><div class="calhead"><h2>${MESL[m-1]} ${y}</h2>
    <div class="calnav"><button class="btn" data-act="mprev" aria-label="Mes anterior">←</button><button class="btn" data-act="hoy">Hoy</button><button class="btn" data-act="mnext" aria-label="Mes siguiente">→</button></div></div>
    <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid">${cells}</div>
    <p class="note">${totC?plural(totC,'reserva','reservas')+' este mes. ':'Sin reservas este mes. '}Toca un día para ver o agregar reservas.</p></div>`;
  const dia=S.reservas.filter(r=>r.fecha===S.fecha).sort(byHora);
  const tot=dia.reduce((a,r)=>a+(Number(r.personas)||0),0);
  const e=S.edit?S.reservas.find(r=>r.id===S.edit):null;
  h+=`<div class="card"><div class="dayhead"><b>${esc(cap(fdate(S.fecha)))}</b> <span>· ${plural(dia.length,'reserva','reservas')} · ${plural(tot,'persona','personas')}</span></div>`;
  h+=dia.length?dia.map(r=>itemHtml(r,'edit')).join(''):'<div class="item"><span class="note">No hay reservas este día.</span></div>';
  return h+'</div>'+formHtml(e);
}
function viewAgenda(){
  const fut=S.reservas.filter(r=>r.fecha>=todayISO).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  if(!fut.length)return '<div class="card panel"><h2>Próximas reservas</h2><p class="note">No hay reservas de hoy en adelante.</p></div>';
  const g={};fut.forEach(r=>(g[r.fecha]=g[r.fecha]||[]).push(r));
  return Object.keys(g).sort().map(d=>{const l=g[d],p=l.reduce((a,r)=>a+(Number(r.personas)||0),0);
    return `<div class="card"><div class="dayhead"><b>${d===todayISO?'Hoy · ':''}${esc(cap(fdate(d)))}</b> <span>· ${plural(l.length,'reserva','reservas')} · ${plural(p,'persona','personas')}</span></div>`+l.map(r=>itemHtml(r,'editgo')).join('')+'</div>'}).join('');
}
function viewLogin(){
  return `<div class="card panel login"><h2>Entrar</h2>
   <div class="fld"><label for="lu">Tu nombre</label><input id="lu" type="text" autocomplete="username" value="${esc(S.user)}" placeholder="Ej. Malen"></div>
   <div class="fld"><label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password"></div>
   <label style="display:flex;gap:8px;align-items:center"><input id="lr" type="checkbox" checked style="min-height:0;width:18px;height:18px"> Mantener la sesión en este dispositivo</label>
   <button class="btn primary" data-act="login">Entrar</button>
   <p class="note">Tu nombre solo sirve para saber quién agregó cada reserva. La contraseña te la da el administrador.</p></div>`;
}
function render(){
  $('#btnOut').hidden=!S.tok;$('#tabs').hidden=!S.tok;
  $('#sub').textContent=S.tok?'Sesión de '+S.user:(S.acc?'Entra para agregar reservas':'');
  for(const b of document.querySelectorAll('#tabs button'))b.setAttribute('aria-selected',String(b.dataset.tab===S.tab));
  const v=$('#view');v.classList.toggle('busy',S.busy);
  if(!S.acc){v.innerHTML=`<div class="card panel login"><h2>${S.err==='Cargando…'?'Cargando…':'Acceso no disponible'}</h2><p class="note">${esc(S.err)}</p></div>`;return}
  v.innerHTML=!S.tok?viewLogin():S.tab==='agenda'?viewAgenda():viewCal();
  $('#banner').innerHTML=S.tok&&S.err?'<div class="banner">'+esc(S.err)+'</div>':'';
}

/* ---------- datos ---------- */
async function refresh(force){
  if(!S.tok||!S.acc||S.busy)return;
  try{
    const {data}=await ghRead();S.err='';
    const changed=JSON.stringify(data.reservas)!==JSON.stringify(S.reservas)||!S.loaded;
    S.loaded=true;S.last=Date.now();
    const a=document.activeElement,typing=a&&/^(INPUT|SELECT)$/.test(a.tagName)&&a.closest&&a.closest('#view');
    if(changed){if(typing&&!force)return;S.reservas=data.reservas;render()}else if(S.err==='')$('#banner').innerHTML='';
  }catch(e){if(e.status===401){logout();toast(e.message);return}S.err=S.loaded?'Sin conexión. Mostrando los últimos datos.':(e.message||'No se pudieron cargar las reservas.');render()}
}
function logout(){S.tok='';S.reservas=[];S.loaded=false;S.edit=null;try{localStorage.removeItem(TK);sessionStorage.removeItem(TK)}catch(e){}render()}

async function login(){
  const user=$('#lu').value.trim(),pw=$('#lp').value,rem=$('#lr').checked;
  if(!user||!pw){toast('Escribe tu nombre y la contraseña.');return}
  S.busy=true;render();let tok;
  try{tok=await unlock(pw,S.acc)}catch(e){S.busy=false;render();const u=$('#lu');if(u)u.value=user;toast('Contraseña incorrecta.');return}
  S.tok=tok;S.user=user;
  try{
    const {data}=await ghRead();S.reservas=data.reservas;S.loaded=true;S.err='';
    try{if(rem){localStorage.setItem(TK,tok);localStorage.setItem(UK,user)}else{localStorage.setItem(UK,user)}}catch(e){}
  }catch(e){S.tok='';S.err='';toast(e.message||'No se pudo entrar.')}
  S.busy=false;render();
}

function readForm(){
  const fecha=$('#rf').value,hh=$('#rhh').value,hora=hh?hh+':'+($('#rhm').value||'00'):'',nombre=$('#rn').value.trim(),personas=Number($('#rp').value),nota=$('#rt').value.trim();
  const falta=[];if(!fecha)falta.push('la fecha');if(!hora)falta.push('la hora');if(!nombre)falta.push('el nombre');if(!(personas>0))falta.push('las personas');
  if(falta.length){toast('Falta '+falta.join(', ')+'.');return null}
  return{fecha,hora,nombre,personas,nota};
}
async function saveRes(){
  const rec=readForm();if(!rec||S.busy)return;
  const editId=S.edit,newId='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  S.busy=true;render();
  try{
    const next=await ghUpdate((editId?'Edita reserva ':'Reserva ')+rec.fecha+' · '+S.user,d=>{
      const r=editId?d.reservas.find(x=>x.id===editId):null;
      if(r)Object.assign(r,rec,{editadoPor:S.user});else d.reservas.push(Object.assign({id:editId||newId},rec,{por:S.user}));
      return d});
    S.reservas=next.reservas;S.fecha=rec.fecha;S.mes=rec.fecha.slice(0,7);S.edit=null;S.err='';
    toast(editId?'Reserva actualizada':'Reserva guardada: '+fdate(rec.fecha));
  }catch(e){if(e.status===401){logout()}toast(e.message||'No se pudo guardar. Revisa tu conexión.')}
  S.busy=false;render();
}
async function delRes(id){
  S.busy=true;render();
  try{const next=await ghUpdate('Borra reserva · '+S.user,d=>{d.reservas=d.reservas.filter(r=>r.id!==id);return d});
    S.reservas=next.reservas;if(S.edit===id)S.edit=null;toast('Reserva borrada')}
  catch(e){toast(e.message||'No se pudo borrar.')}
  S.busy=false;render();
}

/* ---------- eventos ---------- */
$('#btnOut').addEventListener('click',logout);
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;S.confirm=null;render()});
$('#view').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='lu'||e.target.id==='lp'){e.preventDefault();login()}
  else if(/^r[fnpt]$/.test(e.target.id)){e.preventDefault();saveRes()}
});
$('#view').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='login')login();
  else if(act==='mprev'){S.mes=shiftMonth(S.mes,-1);render()}
  else if(act==='mnext'){S.mes=shiftMonth(S.mes,1);render()}
  else if(act==='hoy'){S.fecha=todayISO;S.mes=todayISO.slice(0,7);S.edit=null;render()}
  else if(act==='goto'){S.fecha=b.dataset.d;S.mes=S.fecha.slice(0,7);S.edit=null;render();const f=$('#formcard');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(act==='save')saveRes();
  else if(act==='cancel'){S.edit=null;render()}
  else if(act==='edit'||act==='editgo'){const r=S.reservas.find(x=>x.id===b.dataset.id);if(!r)return;
    S.edit=r.id;S.fecha=r.fecha;S.mes=r.fecha.slice(0,7);S.tab='cal';render();const f=$('#formcard');if(f)f.scrollIntoView({block:'center'})}
  else if(act==='del'){const id=b.dataset.id,k='r:'+id;
    if(S.confirm===k){S.confirm=null;delRes(id)}
    else{S.confirm=k;render();setTimeout(()=>{if(S.confirm===k){S.confirm=null;render()}},3000)}}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},45000);

/* ---------- arranque ---------- */
(async function(){
  try{S.tok=localStorage.getItem(TK)||'';S.user=localStorage.getItem(UK)||''}catch(e){}
  try{
    const r=await fetch('acceso.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;S.acc=await r.json();if(!S.acc||!S.acc.ct)throw 0;S.err='';
  }catch(e){S.acc=null;S.err=/^https?:/.test(location.protocol)?'El acceso todavía no está configurado. Pídele al administrador que lo cree (puede tardar 1 o 2 minutos en aparecer).':'Abre esta página desde su dirección en internet, no como archivo suelto.'}
  if(S.acc&&S.tok){await refresh(true);if(!S.tok)return}
  render();
})();
})();
</script>
</body></html>
