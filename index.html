<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reservas de hoy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef2f2; --surface:#ffffff; --ink:#12232b; --muted:#5d727b; --line:#d6e0e2;
  --accent:#0a6a7d; --accent-ink:#ffffff; --accent-soft:#d9eef2;
  --warn:#9a6200; --warn-soft:#fbecc9;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b20; --surface:#17262d; --ink:#e6eff1; --muted:#93a9b1; --line:#2a3f48;
  --accent:#4fc0d4; --accent-ink:#06222a; --accent-soft:#17414b;
  --warn:#f0bf5a; --warn-soft:#46350f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0}
.sub{color:var(--muted);text-transform:capitalize}
.clock{font-family:var(--f-num);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.win{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.win .l{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.win .r{font-family:var(--f-num);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.win .c{font-size:15px;opacity:.9}
.list{display:flex;flex-direction:column;gap:10px}
.res{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.res .t{font-family:var(--f-num);font-size:26px;font-weight:600;min-width:74px;font-variant-numeric:tabular-nums;color:var(--accent)}
.res .i{display:flex;flex-direction:column;gap:2px;min-width:0}
.res .n{font-family:var(--f-display);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.res .p{color:var(--muted)}
.res .o{margin:4px 0 0;color:var(--ink);background:var(--warn-soft);border-radius:6px;padding:3px 8px;font-size:14px;align-self:flex-start}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:34px 16px;text-align:center;color:var(--muted);font-size:18px}
.foot{color:var(--muted);font-size:13px;text-align:center}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
@media (max-width:480px){h1{font-size:24px}.clock{font-size:24px}.win .r{font-size:28px}.res .t{font-size:22px;min-width:62px}}
</style></head><body>
<div class="wrap">
  <header>
    <div><h1>Reservas de hoy</h1><div class="sub" id="fecha"></div></div>
    <div class="clock" id="reloj" aria-label="Hora actual"></div>
  </header>
  <div id="banner"></div>
  <section class="win" aria-live="polite">
    <span class="l">Reservas de</span>
    <span class="r" id="ventana"></span>
    <span class="c" id="resumen"></span>
  </section>
  <main class="list" id="lista"></main>
  <div class="foot" id="pie"></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let DATA={reservas:[]},lastOk=0;

const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toMin=t=>{const p=String(t||'').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)};
const fmt=x=>{x=((x%1440)+1440)%1440;return pad(Math.floor(x/60))+':'+pad(x%60)};

/* La ventana cambia al minuto :01 de cada hora.
   10:01 a 11:00 -> muestra reservas de 10:01 a 11:00.  11:01 -> de 11:01 a 12:00. */
function windowOf(now){
  const h=now.getHours(),m=now.getMinutes();
  const H=m>=1?h:h-1;
  return{s:H*60+1,e:(H+1)*60};
}

function render(){
  const now=new Date(),w=windowOf(now),hoy=iso(now);
  $('#reloj').textContent=pad(now.getHours())+':'+pad(now.getMinutes());
  $('#fecha').textContent=DIAS[now.getDay()]+' '+now.getDate()+' de '+MESL[now.getMonth()];
  $('#ventana').textContent=fmt(w.s)+' – '+fmt(w.e);
  const list=(DATA.reservas||[]).filter(r=>r.fecha===hoy&&toMin(r.hora)>=w.s&&toMin(r.hora)<=w.e)
    .sort((a,b)=>toMin(a.hora)-toMin(b.hora));
  const pers=list.reduce((a,r)=>a+(Number(r.personas)||0),0);
  $('#resumen').textContent=list.length?list.length+(list.length===1?' reserva':' reservas')+' · '+pers+(pers===1?' persona':' personas'):'';
  $('#lista').innerHTML=list.length?list.map(r=>
    `<article class="res"><div class="t">${esc(r.hora)}</div><div class="i"><span class="n">${esc(r.nombre)}</span>`+
    `<span class="p">${Number(r.personas)||'?'} ${Number(r.personas)===1?'persona':'personas'}</span>`+
    (r.nota?`<span class="o">${esc(r.nota)}</span>`:'')+`</div></article>`).join('')
    :'<div class="empty">Sin reservas en este horario</div>';
  const stale=lastOk&&Date.now()-lastOk>10*60*1000;
  $('#banner').innerHTML=!lastOk?'<div class="banner">Cargando reservas…</div>':stale?'<div class="banner">Sin conexión. Mostrando datos de las '+pad(new Date(lastOk).getHours())+':'+pad(new Date(lastOk).getMinutes())+'.</div>':'';
  $('#pie').textContent=lastOk?'Se actualiza sola · datos de las '+pad(new Date(lastOk).getHours())+':'+pad(new Date(lastOk).getMinutes()):'';
}

async function load(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const j=await r.json();DATA={reservas:Array.isArray(j.reservas)?j.reservas:[]};lastOk=Date.now();
  }catch(e){}
  render();
}
render();load();
setInterval(render,15000);
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();load()}});
})();
</script>
</body></html>
