<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reservas · Administración</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef2f2; --surface:#ffffff; --ink:#12232b; --muted:#5d727b; --line:#d6e0e2;
  --accent:#0a6a7d; --accent-ink:#ffffff; --accent-soft:#d9eef2;
  --ok:#1c7a4a; --warn:#9a6200; --warn-soft:#fbecc9; --bad:#b3261e;
  --head:#e3ebec;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b20; --surface:#17262d; --ink:#e6eff1; --muted:#93a9b1; --line:#2a3f48;
  --accent:#4fc0d4; --accent-ink:#06222a; --accent-soft:#17414b;
  --ok:#5fcf93; --warn:#f0bf5a; --warn-soft:#46350f; --bad:#ff8a80;
  --head:#1d3039; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:0}
h2{font-family:var(--f-display);font-size:18px;margin:0}
.sub{color:var(--muted);margin-top:4px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 8px;min-height:28px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:36px;min-width:0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:0}
.calhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.calhead h2{text-transform:capitalize}
.calnav{display:flex;gap:6px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{font-size:12px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.day{font:inherit;min-height:58px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.day.out{visibility:hidden;pointer-events:none}
.day.past{opacity:.55}
.day.today{border-color:var(--warn);border-width:2px}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.day .n{font-family:var(--f-num);font-size:14px;font-weight:500}
.day .c{font-size:11px;font-family:var(--f-num);font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.day .p{font-size:10px;color:var(--muted);font-family:var(--f-num)}
.item{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-family:var(--f-num);font-weight:600;font-size:18px;min-width:56px;color:var(--accent)}
.item .i{flex:1 1 200px;min-width:0}
.item .i b{font-family:var(--f-display);font-size:16px}
.item .i span{color:var(--muted)}
.item .a{display:flex;gap:6px}
.item.editing{background:var(--accent-soft)}
.dayhead{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--head);border-radius:8px 8px 0 0}
.dayhead span{color:var(--muted);text-transform:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:20;max-width:90vw}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
@media (max-width:560px){h1{font-size:22px}.day{min-height:52px}}
</style></head><body>
<div class="wrap">
  <header>
    <div><h1>Reservas · Administración</h1><div class="sub" id="sub">Solo tú ves esta página</div></div>
    <div class="row"><button class="btn primary" id="btnPub">Publicar cambios</button></div>
  </header>
  <div id="banner"></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="reservas" aria-selected="true">Calendario</button>
    <button role="tab" data-tab="agenda" aria-selected="false">Próximas reservas</button>
    <button role="tab" data-tab="publicar" aria-selected="false">Publicación</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=isoOf(new Date());
const parse=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const shiftMonth=(ym,n)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const fdate=iso=>{const d=parse(iso);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESL[d.getMonth()]};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const toMin=t=>{const p=String(t||'').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)};
const byHora=(a,b)=>toMin(a.hora)-toMin(b.hora)||String(a.nombre).localeCompare(String(b.nombre));
const plural=(n,s,p)=>n+' '+(n===1?s:p);
const llegTxt=r=>r.llegada?' · <b style="color:var(--ok)">✓ llegaron '+(Number(r.llegada.personas)||0)+(r.llegada.hora?' ('+esc(r.llegada.hora)+')':'')+'</b>':r.noLlego?' · <b style="color:var(--bad)">✗ no llegó</b>':'';
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}

const KEY='reservas_v1',DK='reservas_dirty',GHK='reservas_gh',BAK='reservas_bak';
const S={reservas:[],cfg:{},fecha:todayISO,mes:todayISO.slice(0,7),edit:null,tab:'reservas',confirm:null};

/* ---------- almacenamiento local ---------- */
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.reservas)){S.reservas=r.reservas;S.cfg=r.cfg||{}}}catch(e){}try{if(localStorage.getItem('reservas_base')===null)setBase()}catch(e){}}
function persist(dirty){try{localStorage.setItem(KEY,JSON.stringify({cfg:S.cfg,reservas:S.reservas}));if(dirty)localStorage.setItem(DK,'1');else{localStorage.removeItem(DK);setBase()}}catch(e){toast('Este navegador no deja guardar datos (¿modo privado?). Publica antes de cerrar.')}}
/* BASE = ids que ya estaban publicados la última vez que este dispositivo se sincronizó */
const BK='reservas_base';
function getBase(){try{return JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){return[]}}
function setBase(){try{localStorage.setItem(BK,JSON.stringify(S.reservas.map(r=>r.id)))}catch(e){}}
const isDirty=()=>{try{return !!localStorage.getItem(DK)}catch(e){return false}};
function mutate(){S.cfg.actualizado=todayISO;persist(true);render()}

/* ---------- vistas ---------- */
function viewCal(){
  const [y,m]=S.mes.split('-').map(Number);
  const lead=(new Date(y,m-1,1).getDay()+6)%7, dim=new Date(y,m,0).getDate();
  const agg={};let totC=0;
  S.reservas.forEach(r=>{const a=agg[r.fecha]||(agg[r.fecha]={c:0,p:0});a.c++;a.p+=Number(r.personas)||0;if(String(r.fecha).startsWith(S.mes))totC++});
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span class="day out"></span>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+pad(m)+'-'+pad(d),a=agg[iso];
    cells+=`<button class="day${iso<todayISO?' past':''}${iso===todayISO?' today':''}${iso===S.fecha?' sel':''}" data-act="goto" data-d="${iso}" aria-label="${esc(fdate(iso))}${a?', '+plural(a.c,'reserva','reservas'):''}"><span class="n">${d}</span>${a?`<span class="c">${a.c}</span><span class="p">${a.p}p</span>`:''}</button>`;
  }
  let h=`<div class="card panel"><div class="calhead"><h2>${MESL[m-1]} ${y}</h2>
    <div class="calnav"><button class="btn" data-act="mprev" aria-label="Mes anterior">←</button><button class="btn" data-act="hoy">Hoy</button><button class="btn" data-act="mnext" aria-label="Mes siguiente">→</button></div></div>
    <div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid">${cells}</div>
    <p class="note">${totC?plural(totC,'reserva','reservas')+' este mes. ':'Sin reservas este mes. '}Toca un día para ver o agregar reservas. En cada día: número de reservas y personas (p).</p></div>`;

  const dia=S.reservas.filter(r=>r.fecha===S.fecha).sort(byHora);
  const tot=dia.reduce((a,r)=>a+(Number(r.personas)||0),0);
  const e=S.edit?S.reservas.find(r=>r.id===S.edit):null;
  const [eh,em]=e?String(e.hora).split(':'):['',''];
  const mins=[];for(let i=0;i<60;i+=5)mins.push(pad(i));if(em&&!mins.includes(em))mins.push(em);mins.sort();
  const hopt='<option value="">--</option>'+Array.from({length:24},(_,i)=>`<option value="${pad(i)}"${pad(i)===eh?' selected':''}>${pad(i)}</option>`).join('');
  const mopt=mins.map(x=>`<option value="${x}"${x===(em||'00')?' selected':''}>${x}</option>`).join('');
  h+=`<div class="card"><div class="dayhead"><b>${esc(cap(fdate(S.fecha)))}</b> <span>· ${plural(dia.length,'reserva','reservas')} · ${plural(tot,'persona','personas')}</span></div>`;
  h+=dia.length?dia.map(r=>`<div class="item${S.edit===r.id?' editing':''}"><span class="t">${esc(r.hora)}</span><div class="i"><b>${esc(r.nombre)}</b> <span>· ${Number(r.personas)||'?'} pers.${r.nota?' · '+esc(r.nota):''}${r.por?' · por '+esc(r.por):''}${llegTxt(r)}</span></div><div class="a"><button class="btn small" data-act="edit" data-id="${esc(r.id)}">Editar</button><button class="btn small danger" data-act="del" data-id="${esc(r.id)}">${S.confirm==='r:'+r.id?'¿Borrar?':'Borrar'}</button></div></div>`).join(''):'<div class="item"><span class="note">No hay reservas este día.</span></div>';
  h+='</div>';
  h+=`<div class="card panel" id="formcard"><h2>${e?'Editar reserva':'Agregar reserva'}</h2>
    <div class="row">
      <div class="fld"><label for="rf">Fecha</label><input id="rf" type="date" value="${esc(e?e.fecha:S.fecha)}" style="font-family:var(--f-num)"></div>
      <div class="fld"><label for="rhh">Hora (24 h)</label><div style="display:flex;gap:4px;align-items:center"><select id="rhh" style="font-family:var(--f-num)">${hopt}</select><b>:</b><select id="rhm" style="font-family:var(--f-num)">${mopt}</select></div></div>
      <div class="fld"><label for="rp">Personas</label><input id="rp" type="number" min="1" inputmode="numeric" value="${esc(e?e.personas:'')}" style="width:90px;font-family:var(--f-num)"></div>
    </div>
    <div class="row">
      <div class="fld" style="flex:1 1 180px"><label for="rn">Nombre</label><input id="rn" type="text" value="${esc(e?e.nombre:'')}" autocomplete="off" placeholder="Solo nombre"></div>
      <div class="fld" style="flex:1 1 200px"><label for="rt">Nota (opcional)</label><input id="rt" type="text" value="${esc(e?e.nota:'')}" autocomplete="off" placeholder="Ej. cumpleaños, alergia, mesa 3"></div>
    </div>
    <div class="row"><button class="btn primary" data-act="save">${e?'Guardar cambios':'Agregar reserva'}</button>${e?'<button class="btn" data-act="cancel">Cancelar</button>':''}</div>
    <p class="note">Puedes cambiar la fecha para registrar reservas de días futuros. Después de agregar, pulsa «Publicar cambios».</p></div>`;
  return h;
}

function viewAgenda(){
  const fut=S.reservas.filter(r=>r.fecha>=todayISO).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  if(!fut.length)return '<div class="card panel"><h2>Próximas reservas</h2><p class="note">No hay reservas de hoy en adelante.</p></div>';
  const g={};fut.forEach(r=>(g[r.fecha]=g[r.fecha]||[]).push(r));
  return Object.keys(g).sort().map(d=>{
    const l=g[d],p=l.reduce((a,r)=>a+(Number(r.personas)||0),0);
    return `<div class="card"><div class="dayhead"><b>${d===todayISO?'Hoy · ':''}${esc(cap(fdate(d)))}</b> <span>· ${plural(l.length,'reserva','reservas')} · ${plural(p,'persona','personas')}</span></div>`+
      l.map(r=>`<div class="item"><span class="t">${esc(r.hora)}</span><div class="i"><b>${esc(r.nombre)}</b> <span>· ${Number(r.personas)||'?'} pers.${r.nota?' · '+esc(r.nota):''}${r.por?' · por '+esc(r.por):''}${llegTxt(r)}</span></div><div class="a"><button class="btn small" data-act="editgo" data-id="${esc(r.id)}">Editar</button></div></div>`).join('')+'</div>';
  }).join('');
}

function viewPublicar(){
  const c=Object.assign({},guessRepo(),gh());const conn=!!c.token;
  return `<div class="card panel"><h2>Conexión con GitHub</h2>
  <p class="note">${conn?'Este dispositivo ya puede publicar. Estado: '+(isDirty()?'<b>hay cambios sin publicar</b>.':'todo está publicado.'):'Conecta una vez cada dispositivo (celular y computadora) para poder pulsar «Publicar cambios».'}</p>
  <div class="row">
    <div class="fld"><label for="gho">Usuario de GitHub</label><input id="gho" value="${esc(c.owner||'')}" autocomplete="off" style="width:190px"></div>
    <div class="fld"><label for="ghr">Nombre del repositorio</label><input id="ghr" value="${esc(c.repo||'')}" autocomplete="off" style="width:230px"></div>
    <div class="fld" style="flex:1 1 260px"><label for="ght">Token de acceso</label><input id="ght" type="password" value="${esc(c.token||'')}" autocomplete="off" placeholder="github_pat_…"></div>
  </div>
  <div class="row"><button class="btn primary" data-act="ghsave">Guardar y probar</button>${conn?'<button class="btn danger" data-act="ghoff">Desconectar este dispositivo</button>':''}</div>
  <p class="note">El token se guarda solo en este dispositivo, nunca en la página ni en el repositorio.</p></div>
  <div class="card panel"><h2>Acceso para socios</h2>
  <p class="note">Crea un enlace para que tus socios agreguen reservas con su nombre y una contraseña compartida, sin instalar ni configurar nada. Requiere que este dispositivo ya esté conectado arriba.</p>
  <div class="row">
   <div class="fld" style="flex:1 1 220px"><label for="sp">Contraseña para los socios</label><input id="sp" type="text" autocomplete="off" placeholder="Mínimo 8 caracteres"></div>
   <div class="fld" style="flex:1 1 260px"><label for="st">Token para los socios (recomendado)</label><input id="st" type="password" autocomplete="off" placeholder="github_pat_… (vacío = usa el tuyo)"></div>
  </div>
  <div class="row"><button class="btn primary" data-act="mkacc">${S.accDone?'Actualizar acceso':'Crear acceso para socios'}</button></div>
  <p class="note">Enlace para tus socios: <b>${esc(new URL('agenda.html',location.href).href)}</b> <button class="btn small" data-act="copylink">Copiar</button></p>
  <p class="note">Crea un token aparte solo para ellos (mismos pasos de abajo, con otro nombre, por ejemplo «Reservas socios»). Así, si algún día necesitas cortar su acceso, lo borras en GitHub sin afectar el tuyo. La contraseña no se guarda en ningún archivo: solo sirve para abrir el token cifrado.</p></div>
  <div class="card panel"><h2>Cómo crear el token (una vez)</h2>
  <ol class="note" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
   <li>Entra a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>.</li>
   <li>Ponle un nombre, por ejemplo «Reservas isla», y elige la vigencia más larga.</li>
   <li>En <b>Repository access</b> elige <b>Only select repositories</b> y marca solo el repositorio de las reservas.</li>
   <li>En <b>Permissions → Repository permissions</b> pon <b>Contents</b> en <b>Read and write</b>.</li>
   <li>Pulsa <b>Generate token</b>, copia el texto que empieza con <code>github_pat_</code> y pégalo arriba.</li>
  </ol></div>`;
}

function render(){
  for(const b of document.querySelectorAll('#tabs button'))b.setAttribute('aria-selected',String(b.dataset.tab===S.tab));
  $('#view').innerHTML=S.tab==='publicar'?viewPublicar():S.tab==='agenda'?viewAgenda():viewCal();
  $('#banner').innerHTML=isDirty()&&S.tab!=='publicar'?'<div class="banner">Tienes cambios sin publicar. Pulsa «Publicar cambios» para que mesa y recepción los vean.</div>':'';
  const a=S.cfg.actualizado;$('#sub').textContent='Solo tú ves esta página'+(a?' · Última edición: '+fdate(a):'');
  refreshPub();
}
function refreshPub(){const b=$('#btnPub');if(!b||b.disabled)return;const d=isDirty();b.textContent=d?'Publicar cambios':'Todo publicado';b.classList.toggle('primary',d)}

/* ---------- eventos ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;S.confirm=null;render()});
$('#view').addEventListener('keydown',e=>{if(e.key==='Enter'&&/^r[fnpt]$/.test(e.target.id)){e.preventDefault();saveRes()}});
function saveRes(){
  const fecha=$('#rf').value,hora=$('#rhh').value?$('#rhh').value+':'+($('#rhm').value||'00'):'',nombre=$('#rn').value.trim(),personas=Number($('#rp').value),nota=$('#rt').value.trim();
  const falta=[];if(!fecha)falta.push('la fecha');if(!hora)falta.push('la hora');if(!nombre)falta.push('el nombre');if(!(personas>0))falta.push('las personas');
  if(falta.length){toast('Falta '+falta.join(', ')+'.');return}
  if(S.edit){const r=S.reservas.find(x=>x.id===S.edit);if(r)Object.assign(r,{fecha,hora,nombre,personas,nota});S.edit=null;toast('Reserva actualizada')}
  else{S.reservas.push({id:'r'+Date.now().toString(36),fecha,hora,nombre,personas,nota});toast('Reserva agregada el '+fdate(fecha))}
  S.fecha=fecha;S.mes=fecha.slice(0,7);
  mutate();const h=$('#rhh');if(h)h.focus();
}
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='mprev'){S.mes=shiftMonth(S.mes,-1);render()}
  else if(act==='mnext'){S.mes=shiftMonth(S.mes,1);render()}
  else if(act==='hoy'){S.fecha=todayISO;S.mes=todayISO.slice(0,7);S.edit=null;render()}
  else if(act==='goto'){S.fecha=b.dataset.d;S.mes=S.fecha.slice(0,7);S.edit=null;render();const f=$('#formcard');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})}
  else if(act==='save')saveRes();
  else if(act==='cancel'){S.edit=null;render()}
  else if(act==='edit'||act==='editgo'){
    const r=S.reservas.find(x=>x.id===b.dataset.id);if(!r)return;
    S.edit=r.id;S.fecha=r.fecha;S.mes=r.fecha.slice(0,7);S.tab='reservas';render();
    const f=$('#formcard');if(f)f.scrollIntoView({block:'center'})}
  else if(act==='del'){const id=b.dataset.id,k='r:'+id;
    if(S.confirm===k){S.confirm=null;S.reservas=S.reservas.filter(r=>r.id!==id);if(S.edit===id)S.edit=null;mutate()}
    else{S.confirm=k;render();setTimeout(()=>{if(S.confirm===k){S.confirm=null;render()}},3000)}}
  else if(act==='ghsave'){
    const c={owner:$('#gho').value.trim(),repo:$('#ghr').value.trim(),token:$('#ght').value.trim()};
    if(!c.owner||!c.repo||!c.token){toast('Completa usuario, repositorio y token.');return}
    try{await ghSha(c);localStorage.setItem(GHK,JSON.stringify(c));toast('Conexión correcta. Ya puedes publicar.');render()}
    catch(x){toast((x&&x.message)||'No se pudo conectar.')}
  }
  else if(act==='ghoff'){try{localStorage.removeItem(GHK)}catch(x){}toast('Dispositivo desconectado.');render()}
  else if(act==='mkacc')makeAccess(b);
  else if(act==='copylink'){const u=new URL('agenda.html',location.href).href;try{await navigator.clipboard.writeText(u);toast('Enlace copiado')}catch(x){toast('Copia el enlace manualmente.')}}
});

/* ---------- acceso para socios: token cifrado con la contraseña ---------- */
const toB64=u8=>{let s='';u8.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
async function makeAccess(b){
  const c=gh();
  if(!c.token){toast('Primero conecta GitHub en la parte de arriba.');return}
  const pw=$('#sp').value,tk=($('#st').value||'').trim()||c.token;
  if(pw.length<8){toast('La contraseña debe tener al menos 8 caracteres.');return}
  b.disabled=true;const txt=b.textContent;b.textContent='Creando…';
  try{
    await ghSha(Object.assign({},c,{token:tk}));
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({t:tk}))));
    const acc={v:1,owner:c.owner,repo:c.repo,iter,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)};
    let sha;const g=await fetch(ghUrl(c,'acceso.json'),{headers:ghH(c),cache:'no-store'});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw ghErr(g);
    const body={message:'Acceso para socios',content:b64e(JSON.stringify(acc))};if(sha)body.sha=sha;
    const r=await fetch(ghUrl(c,'acceso.json'),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH(c)),body:JSON.stringify(body)});
    if(!r.ok)throw ghErr(r);
    S.accDone=true;toast('Acceso creado. En 1 o 2 minutos ya funciona el enlace.');render();return;
  }catch(e){toast((e&&e.message)||'No se pudo crear el acceso.')}
  b.disabled=false;b.textContent=txt;
}

/* ---------- publicación en GitHub ---------- */
const gh=()=>{try{return JSON.parse(localStorage.getItem(GHK)||'null')||{}}catch(e){return{}}};
function guessRepo(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);if(h.endsWith('.github.io'))return{owner:h.split('.')[0],repo:(p[0]&&!p[0].includes('.'))?p[0]:h};return{}}
const ghUrl=(c,f)=>'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+(f||'data.json');
const ghH=c=>({'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));
function ghErr(r){const e=new Error(r.status===401?'El token no es válido o venció.':r.status===403?'El token no tiene permiso de escritura en este repositorio.':r.status===404?'No encuentro el archivo en ese repositorio. Revisa usuario y nombre.':'GitHub respondió con error '+r.status+'.');e.status=r.status;return e}
async function ghSha(c){const r=await fetch(ghUrl(c),{headers:ghH(c),cache:'no-store'});if(!r.ok)throw ghErr(r);return (await r.json()).sha}
async function publicar(){
  const c=gh();
  if(!c.token){toast('Primero conecta GitHub en la pestaña Publicación.');S.tab='publicar';render();return}
  const b=$('#btnPub');b.disabled=true;b.textContent='Publicando…';
  try{
    /* Fusiona con lo que otros (socios) agregaron mientras tanto: lo nuevo de ellos se conserva,
       lo que borraste aquí se borra, y lo que editaste aquí manda. */
    const base=new Set(getBase()),mine=new Set(S.reservas.map(r=>r.id));let merged=null,added=0;
    for(let i=0;i<4&&!merged;i++){
      const g=await fetch(ghUrl(c),{headers:ghH(c),cache:'no-store'});if(!g.ok)throw ghErr(g);
      const o=await g.json();let remote={};try{remote=JSON.parse(b64d(o.content))}catch(x){}
      const extras=(Array.isArray(remote.reservas)?remote.reservas:[]).filter(r=>!base.has(r.id)&&!mine.has(r.id));
      /* Las marcas de llegada las hace la mesa: aquí siempre manda lo que ya está publicado. */
      const rmap=new Map((Array.isArray(remote.reservas)?remote.reservas:[]).map(x=>[x.id,x]));
      const mineM=S.reservas.map(r=>{const x=rmap.get(r.id);if(!x)return r;const n=Object.assign({},r);delete n.llegada;delete n.noLlego;if(x.llegada)n.llegada=x.llegada;if(x.noLlego)n.noLlego=x.noLlego;return n});
      const all=[...mineM,...extras].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
      const r=await fetch(ghUrl(c),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghH(c)),body:JSON.stringify({message:'Actualización de reservas '+todayISO,content:b64e(JSON.stringify({cfg:S.cfg,reservas:all},null,1)),sha:o.sha})});
      if(r.ok){merged=all;added=extras.length}else if(r.status!==409&&r.status!==422)throw ghErr(r);
    }
    if(!merged)throw new Error('Alguien guardó al mismo tiempo. Pulsa «Publicar cambios» otra vez.');
    S.reservas=merged;persist(false);
    toast('Publicado'+(added?' (incluye '+plural(added,'reserva nueva','reservas nuevas')+' de tus socios)':'')+'. Se verá en 1 o 2 minutos.');
  }catch(e){toast((e&&e.message)||'No se pudo publicar. Revisa tu conexión.')}
  b.disabled=false;render();
}
$('#btnPub').addEventListener('click',publicar);

/* Lee lo publicado SOLO si aquí no hay cambios pendientes. Con token se lee por la API de GitHub
   (siempre al día); la página pública puede tardar 1-2 minutos y traería datos viejos. */
async function pull(){
  if(isDirty())return;
  const c=gh();let j;
  try{
    if(c.token){
      const r=await fetch(ghUrl(c),{headers:ghH(c),cache:'no-store'});if(!r.ok)return;
      const o=await r.json();if(!o.content)return;j=JSON.parse(b64d(o.content));
    }else{
      if(!/^https?:/.test(location.protocol)||S.reservas.length)return;
      const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;j=await r.json();
    }
  }catch(e){return}
  if(isDirty()||!j||!Array.isArray(j.reservas))return;
  const a=document.activeElement;if(a&&/^(INPUT|SELECT)$/.test(a.tagName)&&a.closest('#view'))return;
  if(JSON.stringify(j.reservas)===JSON.stringify(S.reservas))return;
  try{if(S.reservas.length)localStorage.setItem(BAK,JSON.stringify({cfg:S.cfg,reservas:S.reservas}))}catch(e){}
  S.reservas=j.reservas;S.cfg=j.cfg||{};persist(false);render();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
setInterval(()=>{if(!document.hidden)pull()},60000);

/* ---------- arranque ---------- */
loadLocal();render();
pull().then(()=>{if(!gh().token&&!S.reservas.length){S.tab='publicar';render()}});
})();
